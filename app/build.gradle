apply plugin: 'com.android.application'

android {
	compileSdkVersion 25
	buildToolsVersion '25.0.3'

	lintOptions{
		disable 'MissingTranslation'
	}
	defaultConfig {
		applicationId "samuelpalmer.sensorautorotation"
		minSdkVersion 14
		targetSdkVersion 25
		versionCode 53
		versionName "1.1.0"

		/*
		 * Strips out languages added through the support library so that:
		 * - The resulting APK is smaller
		 * - Google Play doesn't think the app supports all languages
		 * - Users with unsupported languages don't see English text in RTL layouts
		 */
		resConfigs "en", "ru"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
}

repositories {
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	compile fileTree(include: ['*.jar'], dir: 'libs')
	compile project(':common')
	provided project(':com.sony.smallapp')

	compile 'com.android.support:appcompat-v7:25.3.1'
	compile 'com.android.support:design:25.3.1'
	compile 'com.android.support:cardview-v7:25.3.1'
	compile 'com.booking:rtlviewpager:1.0.1'
}
