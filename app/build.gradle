apply plugin: 'com.android.application'

// Try reading secrets from file
def secretsPropertiesFile = rootProject.file("secrets.properties")
def secretProperties = new Properties()

if (secretsPropertiesFile.exists()) {
    secretProperties.load(new FileInputStream(secretsPropertiesFile))
}
// Otherwise read from environment variables, this happens in CI
else {
    secretProperties.setProperty("signing_keystore_password", "${System.getenv('signing_keystore_password')}")
    secretProperties.setProperty("signing_key_password", "${System.getenv('signing_key_password')}")
    secretProperties.setProperty("signing_key_alias", "${System.getenv('signing_key_alias')}")
}

android {
    // Compile SDK version moved into gradle.properties so CI pipeline can read it
    def compileSdkVersionString = project.'app.compileSdkVersion'
    compileSdkVersion compileSdkVersionString.isInteger() ? compileSdkVersionString as Integer : compileSdkVersionString

    lintOptions{
        disable 'MissingTranslation'
    }
    defaultConfig {
        applicationId "samuelpalmer.sensorautorotation"

        if (gradle.startParameter.taskNames.contains(":app:assembleDebugAndroidTest")) {
            // The automated tests cannot run below API 18 because UI Automator isn't available on older versions
            minSdkVersion 18
        } else {
            minSdkVersion 16
        }

        targetSdkVersion 30
        versionCode 71
        versionName "2.7.1"

        /*
         * Strips out languages added through the support library so that:
         * - The resulting APK is smaller
         * - Google Play doesn't think the app supports all languages
         * - Users with unsupported languages don't see English text in RTL layouts
         */
        resConfigs "en", "ru"
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // You need to specify either an absolute path or include the
            // keystore file in the same directory as the build.gradle file.
            storeFile file("../android-signing-keystore.jks")
            storePassword "${secretProperties['signing_keystore_password']}"
            keyAlias "${secretProperties['signing_key_alias']}"
            keyPassword "${secretProperties['signing_key_password']}"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // The development version of the app must have a different application id so that
            // Google Play Console doesn't associate dev crashes and ANRs with the production version of the app.
            applicationIdSuffix ".dev"
            versionNameSuffix " (Dev)"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(':com.sony.smallapp')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.preference:preference:1.1.1'

    def nav_version = "2.3.3"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    def lifecycle_version = "2.3.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    implementation 'com.google.android.material:material:1.3.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.2'

    androidTestImplementation 'androidx.test:core:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
