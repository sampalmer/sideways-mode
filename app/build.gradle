apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

def releasePropsFile = rootProject.file("release.properties")
def releaseProps = new Properties()
if (releasePropsFile.exists())
	releaseProps.load(new FileInputStream(releasePropsFile))
else
	releaseProps.fabricApiKey = '' // So debug build don't fail

android {
	compileSdkVersion 26
	buildToolsVersion '26.0.1'

	lintOptions{
		disable 'MissingTranslation'
	}
	defaultConfig {
		applicationId "samuelpalmer.sensorautorotation"
		minSdkVersion 14
		targetSdkVersion 26
		versionCode 56
		versionName "1.4.0"

		/*
		 * Strips out languages added through the support library so that:
		 * - The resulting APK is smaller
		 * - Google Play doesn't think the app supports all languages
		 * - Users with unsupported languages don't see English text in RTL layouts
		 */
		resConfigs "en", "ru"
		vectorDrawables.useSupportLibrary = true

		manifestPlaceholders = [fabricApiKey: releaseProps.fabricApiKey]
	}
	buildTypes {
		debug {
			// Disable fabric build ID generation for debug builds
			ext.enableCrashlytics = false
		}
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
}

repositories {
	flatDir {
		dirs 'libs'
	}
	maven { url 'https://maven.fabric.io/public' }
}

dependencies {
	compile fileTree(include: ['*.jar'], dir: 'libs')
	provided project(':com.sony.smallapp')

	//noinspection GradleDependency
	compile 'com.android.support:appcompat-v7:26.0.0'

	//noinspection GradleDependency
	compile 'com.android.support:design:26.0.0'

	//noinspection GradleDependency
	compile 'com.android.support:cardview-v7:26.0.0'

	compile 'com.booking:rtlviewpager:1.0.1'
	compile('com.crashlytics.sdk.android:crashlytics:2.6.8@aar') {
		transitive = true;
	}
}

repositories {
	maven {
		url 'https://maven.google.com'
	}
}
