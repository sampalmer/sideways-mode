apply plugin: 'com.android.application'

android {
	compileSdkVersion 22
	buildToolsVersion '22.0.1'

	defaultConfig {
		applicationId "samuelpalmer.sensorautorotation"
		minSdkVersion 14
		targetSdkVersion 22
		versionCode 21
		versionName "0.7.2"
	}
	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
}

repositories {
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	compile fileTree(include: ['*.jar'], dir: 'libs')
	provided project(':com.sony.smallapp')
	compile "com.android.support:support-v4:22.1.1"
	compile(name:'com.viewpagerindicator-library-2.4.1', ext:'aar')
	compile project(':androidsvg')
}
