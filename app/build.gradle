apply plugin: 'com.android.application'

android {
    compileSdkVersion 29

    lintOptions{
        disable 'MissingTranslation'
    }
    defaultConfig {
        applicationId "samuelpalmer.sensorautorotation"

        if (gradle.startParameter.taskNames.contains(":app:assembleDebugAndroidTest")) {
            // The automated tests cannot run below API 18 because UI Automator isn't available on older versions
            minSdkVersion 18
        } else {
            minSdkVersion 16
        }

        targetSdkVersion 29
        versionCode 71
        versionName "2.7.1"

        /*
         * Strips out languages added through the support library so that:
         * - The resulting APK is smaller
         * - Google Play doesn't think the app supports all languages
         * - Users with unsupported languages don't see English text in RTL layouts
         */
        resConfigs "en", "ru"
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // The development version of the app must have a different application id so that
            // Google Play Console doesn't associate dev crashes and ANRs with the production version of the app.
            applicationIdSuffix ".dev"
            versionNameSuffix " (Dev)"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(':com.sony.smallapp')
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.preference:preference:1.1.1'

    def nav_version = "2.2.2"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    def lifecycle_version = "2.2.0"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    implementation 'com.google.android.material:material:1.1.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.0'

    androidTestImplementation 'androidx.test:core:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'commons-net:commons-net:3.6'
}
