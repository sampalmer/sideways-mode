apply plugin: 'com.android.application'

android {
	compileSdkVersion 27
	buildToolsVersion '27.0.0'

	lintOptions{
		disable 'MissingTranslation'
	}
	defaultConfig {
		applicationId "samuelpalmer.sensorautorotation"
		minSdkVersion 14
		targetSdkVersion 27
		versionCode 56
		versionName "1.4.0"

		/*
		 * Strips out languages added through the support library so that:
		 * - The resulting APK is smaller
		 * - Google Play doesn't think the app supports all languages
		 * - Users with unsupported languages don't see English text in RTL layouts
		 */
		resConfigs "en", "ru"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
	}
}

dependencies {
	compileOnly project(':com.sony.smallapp')
	implementation 'com.android.support:appcompat-v7:27.0.0'
	implementation 'com.android.support:design:27.0.0'
	implementation 'com.android.support:cardview-v7:27.0.0'
}
