apply plugin: 'com.android.application'

android {
	compileSdkVersion 28

	lintOptions{
		disable 'MissingTranslation'
	}
	defaultConfig {
		applicationId "samuelpalmer.sensorautorotation"
		minSdkVersion 14
		targetSdkVersion 28
		versionCode 62
		versionName "2.2.0"

		/*
		 * Strips out languages added through the support library so that:
		 * - The resulting APK is smaller
		 * - Google Play doesn't think the app supports all languages
		 * - Users with unsupported languages don't see English text in RTL layouts
		 */
		resConfigs "en", "ru"
		vectorDrawables.useSupportLibrary = true
	}
	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
		}
		debug {
			// The development version of the app must have a different application id so that
			// Google Play Console doesn't associate dev crashes and ANRs with the production version of the app.
			applicationIdSuffix ".dev"
			versionNameSuffix " (Dev)"
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

dependencies {
	compileOnly project(':com.sony.smallapp')
	implementation 'com.android.support:appcompat-v7:28.0.0-alpha3'
	implementation 'com.android.support:preference-v14:28.0.0-alpha3'
	implementation 'com.android.support:design:28.0.0-alpha3'
}
